name: Deploy React Projects

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build basic-react-app
        working-directory: ./basic-react-app
        run: |
          npm ci
          npm run build

      - name: Build Lottery-Ticket
        working-directory: ./Lottery-Ticket
        run: |
          npm ci
          npm run build

      - name: Build Counter-React
        working-directory: ./Counter-React
        run: |
          npm ci
          npm run build

      - name: Build React-Todo-App-with-ContextAPI
        working-directory: ./React-Todo-App-with-ContextAPI
        run: |
          npm ci
          npm run build

      - name: Prepare Pages
        run: |
          mkdir -p pages/basic-react-app
          mkdir -p pages/Lottery-Ticket
          mkdir -p pages/Counter-React
          mkdir -p pages/React-Todo-App-with-ContextAPI

          cp -r basic-react-app/dist/. pages/basic-react-app/
          cp -r Lottery-Ticket/dist/. pages/Lottery-Ticket/
          cp -r Counter-React/dist/. pages/Counter-React/
          cp -r React-Todo-App-with-ContextAPI/dist/. pages/React-Todo-App-with-ContextAPI/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
